name = "telegram-hub"
main = "src/worker.ts"
compatibility_date = "2026-07-10"
upload_source_maps = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
# Legacy catalog compatibility only. Production connector/provider configuration
# is read from DB_V2 sources/source_connectors after the schema v2 cutover.
TWITTER_SOURCE_PROVIDER = "nitter"
NITTER_BASE_URL = "https://nitter.net/"

[secrets]
required = [
  "TELEGRAM_BOT_TOKEN",
  "IT_HOME_CHAT_ID",
  "TWITTER_CHAT_ID",
  "TWITTER_RSS_URL"
]
# TwitterAPI.io bindings are optional so this version can be deployed before
# the API key is provisioned. See .dev.vars.example and README.md.

# Cron Triggers
# Docs: https://developers.cloudflare.com/workers/platform/triggers/cron-triggers/
# Configuration: https://developers.cloudflare.com/workers/wrangler/configuration/#triggers
[triggers]
crons = [
  "* * * * *",    # 每分钟抓取 Feed 并分发 ready deliveries
  "0 4 * * *"     # 每天 04:00 UTC 恢复陈旧状态并压缩终态内容
]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[[d1_databases]]
binding = "DB"
database_name = "rss"
database_id = "<your-database-id>"

[[d1_databases]]
binding = "DB_V2"
database_name = "telegram-hub-prod"
database_id = "<your-v2-database-id>"
migrations_dir = "migrations_v2"

[[queues.producers]]
binding = "TELEGRAM_DELIVERY_QUEUE"
queue = "telegram-delivery"

[[queues.producers]]
binding = "INGESTION_QUEUE"
queue = "source-ingestion"

[[queues.consumers]]
queue = "telegram-delivery"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 30
dead_letter_queue = "telegram-delivery-dlq"
max_concurrency = 1

[[queues.consumers]]
queue = "telegram-delivery-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1

[[queues.consumers]]
queue = "source-ingestion"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 30
dead_letter_queue = "source-ingestion-dlq"
max_concurrency = 5

[[queues.consumers]]
queue = "source-ingestion-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
