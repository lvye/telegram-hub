name: CI and Deploy
on:
  pull_request:
  push:
    branches: [main]

# Never let an older main-branch run deploy after a newer one. Keeping runs
# queued (rather than cancelling mid-migration) makes the D1/Worker rollout
# order deterministic.
concurrency:
  group: telegram-hub-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Set D1 database ID
        run: |
          sed -i 's/<your-database-id>/${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}/' wrangler.toml
          sed -i 's/<your-v2-database-id>/${{ secrets.CLOUDFLARE_D1_V2_DATABASE_ID }}/' wrangler.toml
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 v2 migrations
        run: npm run db:v2:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy --strict --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test deployed Worker
        run: node scripts/smoke-health.mjs
        env:
          EXPECTED_VERSION_TAG: ${{ github.sha }}
          WORKER_BASE_URL: https://telegram-hub.fuhanfeng.workers.dev
