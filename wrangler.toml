name = "telegram-hub"
main = "src/worker.ts"
compatibility_date = "2026-07-10"
upload_source_maps = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[secrets]
required = [
  "TELEGRAM_BOT_TOKEN",
  "IT_HOME_CHAT_ID",
  "TWITTER_CHAT_ID"
]
# TWITTERAPI_IO_API_KEY is optional and only required by an active
# twitterapi-io.user-timeline connector.
# READINESS_TOKEN is optional; when set, GET /health/ready requires
# an "Authorization: Bearer <token>" header.

# Cron Triggers
# Docs: https://developers.cloudflare.com/workers/platform/triggers/cron-triggers/
# Configuration: https://developers.cloudflare.com/workers/wrangler/configuration/#triggers
[triggers]
crons = [
  "* * * * *",    # 每分钟调度到期来源；delivery 随 ingestion 即时分发，Cron 每 5 分钟兜底扫描
  "0 4 * * *"     # 每天 04:00 UTC 恢复陈旧状态并压缩终态内容
]

[observability]
enabled = true

# Structured application logs cover every meaningful event; per-invocation
# log entries would mostly record idle cron minutes against the daily quota.
[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[[d1_databases]]
binding = "DB"
database_name = "telegram-hub-prod"
database_id = "<your-database-id>"
migrations_dir = "migrations"

[[queues.producers]]
binding = "TELEGRAM_DELIVERY_QUEUE"
queue = "telegram-delivery"

[[queues.producers]]
binding = "INGESTION_QUEUE"
queue = "source-ingestion"

[[queues.consumers]]
queue = "telegram-delivery"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 30
dead_letter_queue = "telegram-delivery-dlq"
max_concurrency = 1

[[queues.consumers]]
queue = "telegram-delivery-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1

[[queues.consumers]]
queue = "source-ingestion"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
retry_delay = 30
dead_letter_queue = "source-ingestion-dlq"
max_concurrency = 5

[[queues.consumers]]
queue = "source-ingestion-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
